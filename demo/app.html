<title>Huddle App Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: laptop stage, story rail left, live iPhone right. Phone has 3 tabs: Discover (map/list), My week, Texts.
   Single committed look: dusk-ink UI, sunset coral accent, a hand-drawn night map of Seattle. */
:root {
  --desk: #0b0c10; --desk-2: #15161d;
  --ink: #111217; --card: #1b1d24; --card-2: #242731; --line: #ffffff14;
  --text: #f6f1ea; --muted: #9a98a6;
  --coral: #ff7a59; --sun: #ffc857; --mint: #7fe0c4;
  --land: #171a21; --water: #1c2740; --park: #1b2a24; --road: #2a2e39;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(80% 70% at 75% 40%, #2a1a2e 0%, transparent 60%), var(--desk); color: var(--text); font-family: var(--body); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
button { font: inherit; color: inherit; }
.stage { height: 100%; display: grid; grid-template-columns: minmax(0, 340px) auto; gap: 6vw; align-items: center; justify-content: center; }
@media (max-width: 820px) { .stage { grid-template-columns: auto; } .rail { display: none; } }

.rail { display: grid; gap: 26px; }
.brand { font: 800 44px/1 var(--display); letter-spacing: -.03em; } .brand span { color: var(--coral); }
.tag { color: var(--muted); font-size: 16px; line-height: 1.5; max-width: 30ch; margin-top: 12px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.steps button { all: unset; cursor: pointer; display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; color: var(--muted); font-weight: 600; font-size: 15px; transition: background .25s, color .25s; }
.steps button:hover, .steps button:focus-visible { background: var(--desk-2); color: var(--text); }
.steps button b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--display); background: var(--desk-2); }
.steps button.on { color: var(--text); background: var(--desk-2); } .steps button.on b { background: var(--coral); color: var(--ink); }
.fine { color: var(--muted); font-size: 12px; line-height: 1.5; max-width: 34ch; }

.phone-wrap { width: 390px; height: 844px; transform-origin: center; }
.phone { position: relative; width: 390px; height: 844px; border-radius: 56px; background: var(--ink); overflow: hidden;
  box-shadow: 0 0 0 11px #1d1e24, 0 0 0 12px #34353d, 0 40px 120px #000c, 0 0 160px #ff7a5922; }
.island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 122px; height: 35px; border-radius: 20px; background: #000; z-index: 40; }
.statusbar { position: absolute; inset: 0 0 auto; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 6px 34px 0; font: 600 16px var(--body); z-index: 35; pointer-events: none; }
.homebar { position: absolute; bottom: 8px; left: 50%; translate: -50% 0; width: 136px; height: 5px; border-radius: 3px; background: #ffffffcc; z-index: 40; }
.screen { position: absolute; inset: 54px 0 0; display: flex; flex-direction: column; z-index: 5; }
.enter { animation: enter .5s cubic-bezier(.2,.9,.2,1) both; }
@keyframes enter { from { transform: translateX(36px); opacity: 0; } }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0 } 70% { transform: scale(1.08) } 100% { transform: scale(1); opacity: 1 } }
.rise { animation: rise .55s cubic-bezier(.2,.9,.2,1) both; }

h1 { font: 700 28px/1.08 var(--display); letter-spacing: -.03em; margin: 0; text-wrap: balance; } h1 em { font-style: normal; color: var(--coral); }
h2 { font: 700 18px var(--display); letter-spacing: -.02em; margin: 0; }
.kicker { font-size: 13px; color: var(--muted); font-weight: 700; }
.label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.cta { all: unset; cursor: pointer; text-align: center; padding: 17px; border-radius: 18px; background: var(--coral); color: var(--ink); font: 700 15px var(--display); transition: transform .15s, opacity .2s; box-sizing: border-box; }
.cta:active { transform: scale(.97); } .cta:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; } .cta[disabled] { opacity: .35; pointer-events: none; }
.ghost { all: unset; cursor: pointer; text-align: center; padding: 14px; border-radius: 16px; background: var(--card-2); font-weight: 800; font-size: 14px; }

.onb { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 16px 22px 40px; overflow-y: auto; scrollbar-width: none; }
.chipset { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { all: unset; cursor: pointer; padding: 10px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 14px; transition: background .2s, color .2s, transform .15s; }
.pick:active { transform: scale(.95); } .pick:focus-visible { outline: 2px solid var(--coral); }
.pick.on { background: var(--coral); color: var(--ink); border-color: transparent; }
.dots { display: flex; gap: 6px; } .dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--card-2); } .dots i.on { background: var(--coral); }

.top { padding: 8px 22px 10px; display: grid; gap: 10px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border-radius: 14px; padding: 4px; }
.seg button { all: unset; cursor: pointer; text-align: center; padding: 8px; border-radius: 10px; font-weight: 800; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--card-2); color: var(--text); }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -22px; padding: 0 22px; }
.filters button { all: unset; cursor: pointer; flex: none; padding: 7px 11px; border-radius: 999px; background: var(--card); font-size: 12.5px; font-weight: 800; color: var(--muted); }
.filters button.on { background: var(--text); color: var(--ink); }
.body { position: relative; flex: 1; min-height: 0; }

.map { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--land); }
.map:active { cursor: grabbing; }
.map svg { width: 100%; height: 100%; display: block; }
.map .water { fill: var(--water); } .map .canal { stroke: var(--water); fill: none; stroke-linecap: round; }
.map .park { fill: var(--park); } .map .road { stroke: var(--road); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.map .hood { fill: #ffffff38; font-family: var(--body); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; text-anchor: middle; pointer-events: none; }
.pin { cursor: pointer; }
.pin circle.bg { stroke: var(--ink); }
.pin text { text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pin.dim { opacity: .28; }
.pin.joined circle.ring { stroke: var(--mint); fill: none; }
.me circle.pulse { fill: var(--coral); opacity: .25; animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { transform: scale(.6); opacity: .5 } to { transform: scale(2.2); opacity: 0 } }
.mapctl { position: absolute; right: 14px; top: 14px; display: grid; gap: 6px; z-index: 3; }
.mapctl button { all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 12px; background: #1b1d24e6; display: grid; place-items: center; font-weight: 800; font-size: 16px; }
.maplegend { position: absolute; left: 14px; top: 14px; z-index: 3; background: #1b1d24e6; padding: 6px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; color: var(--muted); }

.list { position: absolute; inset: 0; overflow-y: auto; padding: 4px 22px 100px; display: grid; gap: 10px; align-content: start; scrollbar-width: none; }
.ev { all: unset; cursor: pointer; display: grid; grid-template-columns: 58px 1fr; gap: 12px; padding: 12px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); animation: rise .45s both; box-sizing: border-box; }
.ev:hover { border-color: #ffffff30; } .ev:focus-visible { outline: 2px solid var(--coral); }
.tile { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; position: relative; overflow: hidden; }
.tile::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, #ffffff55, transparent 60%); }
.ev h3 { margin: 0; font: 700 14.5px/1.25 var(--display); letter-spacing: -.01em; }
.ev .meta { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: 3px; }
.ev .why { font-size: 12px; color: var(--mint); font-weight: 700; margin-top: 5px; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-radius: 28px 28px 0 0; padding: 10px 22px 34px; display: grid; gap: 12px; box-shadow: 0 -20px 60px #0009; animation: up .45s cubic-bezier(.2,.9,.2,1) both; max-height: 82%; overflow-y: auto; scrollbar-width: none; }
@keyframes up { from { transform: translateY(100%); } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #ffffff33; justify-self: center; }
.sheet .hero { height: 110px; border-radius: 20px; display: grid; place-items: center; font-size: 54px; position: relative; overflow: hidden; }
.sheet .hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, #ffffff55, transparent 60%); }
.sheet .sample { position: absolute; top: 10px; left: 10px; z-index: 2; font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: #0009; color: #fff; padding: 3px 7px; border-radius: 6px; }
.facts { display: grid; gap: 6px; font-size: 14px; font-weight: 600; } .facts span { color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--card-2); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--coral); border-radius: 4px; transition: width .6s cubic-bezier(.2,.9,.2,1); }
.people { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-weight: 700; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--display); color: var(--ink); border: 2px solid var(--card); flex: none; }
.avs { display: flex; } .avs .av + .av { margin-left: -8px; }
.regular { background: var(--card-2); border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.45; font-weight: 600; } .regular b { color: var(--sun); }
.sheet .row { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.close { all: unset; cursor: pointer; position: absolute; top: 14px; right: 16px; width: 30px; height: 30px; border-radius: 50%; background: var(--card-2); display: grid; place-items: center; font-weight: 800; z-index: 3; }
.scrim { position: absolute; inset: 0; background: #0006; z-index: 15; animation: fade .3s both; } @keyframes fade { from { opacity: 0 } }

.tabs { position: absolute; left: 0; right: 0; bottom: 0; z-index: 12; display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px 18px 26px; background: linear-gradient(transparent, var(--ink) 30%); }
.tabs button { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: var(--muted); padding: 6px; border-radius: 12px; position: relative; }
.tabs button.on { color: var(--text); } .tabs svg { width: 22px; height: 22px; }
.tabs .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--coral); color: var(--ink); font-size: 10px; display: grid; place-items: center; padding: 0 4px; animation: pop .4s both; }

.week { flex: 1; overflow-y: auto; padding: 8px 22px 110px; display: grid; gap: 14px; align-content: start; scrollbar-width: none; }
.day { display: grid; gap: 8px; } .day .d { font: 700 13px var(--display); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; display: grid; gap: 14px; font-weight: 600; line-height: 1.5; }
.streak { display: flex; gap: 12px; align-items: center; background: linear-gradient(120deg, #ff7a5926, #ffc85714); border: 1px solid #ff7a5940; border-radius: 20px; padding: 14px; }
.streak b { font: 700 26px var(--display); color: var(--sun); } .streak div { font-size: 13px; font-weight: 600; line-height: 1.4; }

.imsg { flex: 1; display: flex; flex-direction: column; background: #000; min-height: 0; }
.imsg-head { display: grid; justify-items: center; gap: 4px; padding: 6px 0 10px; border-bottom: 1px solid #ffffff14; }
.imsg-head .av { width: 44px; height: 44px; font-size: 18px; background: linear-gradient(150deg, var(--sun), var(--coral)); border: none; }
.imsg-head span { font-size: 12px; font-weight: 600; }
.thread { flex: 1; overflow-y: auto; padding: 12px 14px 170px; display: flex; flex-direction: column; gap: 6px; scrollbar-width: none; }
.b { max-width: 78%; padding: 9px 13px; border-radius: 19px; font-size: 14.5px; line-height: 1.38; white-space: pre-wrap; animation: rise .35s both; font-family: -apple-system, "SF Pro Text", var(--body); }
.b.them { background: #26262a; align-self: flex-start; border-bottom-left-radius: 6px; }
.b.me { background: #2f7cf6; align-self: flex-end; border-bottom-right-radius: 6px; }
.ts { align-self: center; font-size: 11px; color: #8e8e93; font-weight: 600; margin: 8px 0 2px; }
.compose { position: absolute; left: 0; right: 0; bottom: 74px; z-index: 13; display: flex; gap: 8px; padding: 8px 14px; background: #000; margin: 0; }
.compose input { flex: 1; background: #1c1c1e; border: 1px solid #ffffff1f; border-radius: 18px; padding: 9px 14px; color: var(--text); font: 500 14px var(--body); outline: none; }
.compose input:focus { border-color: #2f7cf6; }
.compose button { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; background: #2f7cf6; display: grid; place-items: center; font-weight: 900; }
.quick { position: absolute; left: 0; right: 0; bottom: 126px; z-index: 13; display: flex; gap: 6px; padding: 0 14px; overflow-x: auto; scrollbar-width: none; }
.quick button { all: unset; cursor: pointer; flex: none; padding: 6px 11px; border-radius: 999px; border: 1px solid #2f7cf6; color: #6aa6ff; font-size: 12.5px; font-weight: 700; background: #000; }

.toast { position: absolute; left: 50%; top: 64px; translate: -50% 0; z-index: 50; background: var(--text); color: var(--ink); padding: 10px 16px; border-radius: 999px; font-weight: 800; font-size: 13px; animation: pop .35s both; white-space: nowrap; }
canvas.confetti { position: absolute; inset: 0; z-index: 45; pointer-events: none; }
.c-cafe { background: linear-gradient(150deg, #f3c58a, #c9773e); } .c-sports { background: linear-gradient(150deg, #ffc857, #ff7a59); }
.c-swim { background: linear-gradient(150deg, #7fd8f0, #3a86ff); } .c-outdoors { background: linear-gradient(150deg, #9be38b, #2f9e6e); }
.c-music { background: linear-gradient(150deg, #c9a6ff, #7b5cff); } .c-food { background: linear-gradient(150deg, #ffb4a2, #e5546f); }
.c-art { background: linear-gradient(150deg, #f6a6c1, #b05f9c); } .c-wellness { background: linear-gradient(150deg, #b8f0e0, #43b49b); }
.c-community { background: linear-gradient(150deg, #ffe08a, #e9a23b); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>

<div class="stage">
  <aside class="rail">
    <div><div class="brand">hud<span>dle</span></div>
      <div class="tag">every week, a few things happening near you. tap to show up, keep showing up, find your people.</div></div>
    <ol class="steps" id="steps"></ol>
    <div class="fine">Live demo running our real ranking engine. Events, hosts and attendee counts are sample data for the week of Oct 18, 2026.</div>
  </aside>
  <div class="phone-wrap" id="wrap"><div class="phone" id="phone">
    <div class="island"></div>
    <div class="statusbar"><span>9:41</span><span>
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/></svg></span></div>
    <div id="screen" class="screen"></div>
    <div class="homebar"></div>
  </div></div>
</div>

<script>/*CORE*/</script>
<script>
const { rankEvents, distanceKm, EVENTS, AREAS } = Core;
const NOW = new Date("2026-10-18T05:00:00.000Z"); // demo "now": Sat Oct 17, 10 PM PT
const TZ = "America/Los_Angeles";
const $ = (s, r = document) => r.querySelector(s);
const fmt = (iso, o) => new Intl.DateTimeFormat("en-US", { timeZone: TZ, ...o }).format(new Date(iso));
const dayShort = (iso) => fmt(iso, { weekday: "short" });
const time = (iso) => fmt(iso, { hour: "numeric", minute: "2-digit" });
const price = (n) => (n === 0 ? "free" : "$" + n);
const CATS = [["cafe","☕","cafés & pop-ups"],["sports","🏓","sports"],["swim","🏊","swimming"],["outdoors","🥾","outdoors"],["music","🎸","music"],["food","🥟","food"],["art","🎨","art"],["wellness","🧘","wellness"],["community","🌻","community"]];
const HOODS = ["Capitol Hill","U District","Ballard","Fremont","Queen Anne","West Seattle","Bellevue","Redmond"];
const WHEN = [["weekends","weekends"],["weekday_evenings","weeknights"],["weekday_mornings","mornings"]];
const BUDGETS = [[0,"free only"],[10,"under $10"],[20,"under $20"],[undefined,"any"]];
const AVC = ["#ffc857","#7fe0c4","#f6a6c1","#a9b8ff","#ffb4a2","#c9a6ff"];

let S;
function reset() {
  S = { events: JSON.parse(JSON.stringify(EVENTS)), profile: { interests: ["cafe","sports","outdoors"], home: AREAS["capitol hill"], maxBudget: 20, maxDistanceKm: 8, when: [] },
        joined: new Set(), tab: "discover", view: "map", filter: "for-you", texts: null, view0: null };
}
reset();

// ------------------------------------------------------------ shell
const STEPS = [["Tell us what you're into", () => onboarding(0)], ["Discover on the map", () => go("discover", "map")], ["Browse the list", () => go("discover", "list")],
  ["Join and show up", () => { go("discover", "list"); setTimeout(() => openSheet(forYou()[0].event.id), 350); }], ["Your week", () => go("week")], ["Weekly text", () => go("texts")]];
function rail(i) { $("#steps").innerHTML = STEPS.map(([s], k) => `<li><button data-i="${k}" class="${k === i ? "on" : ""}"><b>${k + 1}</b>${s}</button></li>`).join(""); }
$("#steps").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) STEPS[+b.dataset.i][1](); });
function fit() { const w = $("#wrap"), k = Math.min(1, (innerHeight - 48) / 844, (innerWidth - 32) / 390);
  w.style.transform = `scale(${k})`; w.style.margin = `${-(844 * (1 - k)) / 2}px ${-(390 * (1 - k)) / 2}px`; }
addEventListener("resize", fit); fit();
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; $("#phone").append(el); setTimeout(() => el.remove(), 1800); }
function screen(html) { closeSheet(true); const s = $("#screen"); s.className = "screen"; void s.offsetWidth; s.className = "screen enter"; s.innerHTML = html; return s; }

// ------------------------------------------------------------ data
const forYou = (limit = 5) => rankEvents(S.events, S.profile, NOW, { limit });
function visible() {
  if (S.filter === "for-you") return forYou(6);
  return rankEvents(S.events, { ...S.profile, maxDistanceKm: 40, interests: [S.filter] }, NOW, { limit: 99 }).filter((p) => p.event.category === S.filter);
}
const ev = (id) => S.events.find((e) => e.id === id);
const distTo = (e) => (S.profile.home ? distanceKm(S.profile.home, e) : null);

// ------------------------------------------------------------ 1. onboarding
function onboarding(step) {
  rail(0);
  const dots = `<div class="dots">${[0,1,2].map((i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>`;
  let body = "";
  if (step === 0) body = `<div class="rise"><div class="kicker">welcome to huddle</div><h1>what are you <em>into?</em></h1></div>
    <div class="chipset">${CATS.map(([c, e, l]) => `<button class="pick ${S.profile.interests.includes(c) ? "on" : ""}" data-c="${c}">${e} ${l}</button>`).join("")}</div>`;
  if (step === 1) body = `<div class="rise"><div class="kicker">so we can find things close by</div><h1>where do you <em>hang out?</em></h1></div>
    <div class="chipset">${HOODS.map((h) => `<button class="pick ${S.profile.home?.label === h ? "on" : ""}" data-h="${h}">📍 ${h}</button>`).join("")}</div>`;
  if (step === 2) body = `<div class="rise"><div class="kicker">last one</div><h1>when are you <em>free?</em></h1></div>
    <div class="chipset">${WHEN.map(([w, l]) => `<button class="pick ${S.profile.when.includes(w) ? "on" : ""}" data-w="${w}">${l}</button>`).join("")}</div>
    <div class="label">budget per event</div>
    <div class="chipset">${BUDGETS.map(([b, l], i) => `<button class="pick ${S.profile.maxBudget === b ? "on" : ""}" data-b="${i}">${l}</button>`).join("")}</div>`;
  screen(`<div class="onb">${dots}${body}<div style="flex:1"></div>
    <button class="cta" id="next">${step < 2 ? "next →" : "show me my week →"}</button></div>`);
  $(".onb").addEventListener("click", (e) => {
    const b = e.target.closest(".pick"); if (!b) return;
    if (b.dataset.c) { const set = new Set(S.profile.interests); set.has(b.dataset.c) ? set.delete(b.dataset.c) : set.add(b.dataset.c); S.profile.interests = [...set]; b.classList.toggle("on"); }

  rail(4);

  const days = {};
  for (const e of mine) (days[fmt(e.start, { weekday: "long", month: "short", day: "numeric" })] ??= []).push(e);
  const regulars = mine.filter((e) => e.recurring).length;

    <div class="week">${mine.length ? `
      <div class="streak"><b>${mine.length}</b><div>${mine.length === 1 ? "event" : "events"} this week${regulars ? `, ${regulars} of them weekly. Keep showing up and they become your regular spots.` : ". Weekly events are the easiest way to become a regular."}</div></div>
      ${Object.entries(days).map(([d, es]) => `<div class="day"><div class="d">${d}</div>${es.map((e, i) => card({ event: e, distanceKm: distTo(e), reasons: [] }, i)).join("")}</div>`).join("")}`

const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");

function texts() {
  rail(5);

  const send = (t) => { if (!t.trim()) return; add("me", t); setTimeout(() => { if ($("#th") === th) add("them", reply(t.trim())); }, 600); };
  $("#cf").onsubmit = (e) => { e.preventDefault(); send($("#ci").value); $("#ci").value = ""; };

const MOODS = { cafe: /caf|coffee|matcha|pop/i, sports: /sport|ball|run|climb/i, swim: /swim|pool/i, outdoors: /outdoor|hike|nature|kayak|bike/i,
  music: /music|jam|mic/i, food: /food|eat|dumpling|ramen/i, art: /art|sketch|draw/i, wellness: /yoga|sauna|wellness/i, community: /community|volunteer|game/i };
function reply(t) {
  const up = t.toUpperCase(), L = S.texts.list;
  const n = up.match(/^(?:JOIN\s*)?(\d)$/);
  if (n) { const e = ev(L[+n[1] - 1]); if (!e) return "that number isn't on your list. text EVENTS to see it again.";
    if (S.joined.has(e.id)) return `you're already in for ${e.title}!`;
    S.joined.add(e.id); e.going++; refreshTabs();
    return `you're in! ${e.emoji} ${e.title}\n${fmt(e.start, { weekday: "long" })}, ${time(e.start)} · ${e.place}\n${e.going - 1} others going. I'll text you a reminder before it starts.${e.recurring ? `\n\nit happens ${e.recurring}, so come a few times and you'll be a regular.` : ""}`; }
  const info = up.match(/^INFO\s*(\d)$/);
  if (info) { const e = ev(L[+info[1] - 1]); return e ? `${e.emoji} ${e.title}\n${fmt(e.start, { weekday: "long", month: "short", day: "numeric" })}, ${time(e.start)} – ${time(e.end)}\n📍 ${e.place}\n${price(e.cost)} · ${e.going}/${e.capacity} going\n\n${e.blurb}\n\nreply ${info[1]} to join.` : "that number isn't on your list."; }
  if (up === "MORE") { const p = rankEvents(S.events, S.profile, NOW, { limit: 5, excludeIds: new Set([...L, ...S.joined]) }); if (!p.length) return "that's everything for this week!"; S.texts.list = p.map((x) => x.event.id); return digestText(p); }
  if (up === "MY") { const m = [...S.joined].map(ev); return m.length ? "your plans:\n\n" + m.map((e) => `${e.emoji} ${e.title}, ${dayShort(e.start)} ${time(e.start)}`).join("\n") : "nothing yet. text EVENTS to find something."; }
  if (up === "EVENTS") { const p = forYou(); S.texts.list = p.map((x) => x.event.id); return digestText(p); }
  const mood = Object.keys(MOODS).filter((c) => MOODS[c].test(t));
  if (mood.length) { const p = rankEvents(S.events, { ...S.profile, interests: mood }, NOW, { limit: 5 }); if (!p.length) return "nothing like that fits your settings this week."; S.texts.list = p.map((x) => x.event.id); return digestText(p); }
  return "EVENTS · MORE · 1, 2, 3 to join · INFO 2 · MY · or text a mood like \"something outdoorsy\"";
}

function confetti() {

  const ps = Array.from({ length: 110 }, () => ({ x: 195, y: 640, vx: (Math.random() - .5) * 12, vy: -Math.random() * 15 - 5, r: Math.random() * 6 + 4, a: Math.random() * 6, va: (Math.random() - .5) * .4, c: colors[Math.floor(Math.random() * 5)] }));
  const t0 = performance.now();
  (function f(now) { ctx.clearRect(0, 0, 390, 844);
    for (const p of ps) { p.vy += .38; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if (now - t0 < 2600) requestAnimationFrame(f); else cv.remove(); })(t0);
