/* Layout: soft pastel desk, story rail left, a white iPhone right. Phone tabs: Discover (map/list), My week, Texts.
   Look: "clean girl" — creamy white, sage, blush; an italic serif for headlines, round friendly sans for UI. */
:root {
  --desk: #f4efe9; --desk-2: #ffffffb3;
  --ink: #fffdfa; --card: #ffffff; --card-2: #f5f1ec; --line: #ece5dc;
  --text: #3a3631; --muted: #9c948a;

  --blush: #e9a7b4; --blush-2: #f7dbe0; --blush-3: #fcf0f2;
  --accent: #d98a9a; --accent-ink: #ffffff;
  --land: #f7f3ec; --water: #d9ebe7; --park: #e2edd8; --road: #ffffff;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 6px 24px #b49a8a1f, 0 1px 3px #b49a8a14;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; color: var(--text); font-family: var(--body); overflow: hidden;
  background: radial-gradient(60% 60% at 80% 30%, #f7dbe0 0%, transparent 70%), radial-gradient(50% 60% at 15% 85%, #dbe8d6 0%, transparent 70%), var(--desk);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
button { font: inherit; color: inherit; }
.stage { height: 100%; display: grid; grid-template-columns: minmax(0, 340px) auto; gap: 6vw; align-items: center; justify-content: center; }
@media (max-width: 820px) { .stage { grid-template-columns: auto; } .rail { display: none; } }

.rail { display: grid; gap: 26px; }
.brand { font: italic 64px/0.9 var(--display); letter-spacing: -.02em; } .brand span { color: var(--accent); }
.tag { color: var(--muted); font-size: 16px; line-height: 1.55; max-width: 30ch; margin-top: 12px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.steps button { all: unset; cursor: pointer; display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 16px; color: var(--muted); font-weight: 700; font-size: 15px; transition: background .25s, color .25s; }
.steps button:hover, .steps button:focus-visible { background: var(--desk-2); color: var(--text); }
.steps button b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: italic 17px var(--display); background: #ffffffcc; }
.steps button.on { color: var(--text); background: #ffffffcc; box-shadow: var(--shadow); } .steps button.on b { background: var(--blush-2); color: var(--accent); }
.fine { color: var(--muted); font-size: 12px; line-height: 1.5; max-width: 34ch; }

.phone-wrap { width: 390px; height: 844px; transform-origin: center; }
.phone { position: relative; width: 390px; height: 844px; border-radius: 56px; background: var(--ink); overflow: hidden;
  box-shadow: 0 0 0 10px #fbf8f4, 0 0 0 11px #e6ded4, 0 40px 90px #b49a8a40, 0 0 120px #f7dbe0aa; }
.island { position: absolute; top: 11px; left: 50%; translate: -50% 0; width: 122px; height: 35px; border-radius: 20px; background: #1d1b19; z-index: 40; }
.statusbar { position: absolute; inset: 0 0 auto; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 6px 34px 0; font: 700 16px var(--body); z-index: 35; pointer-events: none; color: var(--text); }
.homebar { position: absolute; bottom: 8px; left: 50%; translate: -50% 0; width: 136px; height: 5px; border-radius: 3px; background: #3a3631cc; z-index: 40; }
.screen { position: absolute; inset: 54px 0 0; display: flex; flex-direction: column; z-index: 5; }
.enter { animation: enter .5s cubic-bezier(.2,.9,.2,1) both; }
@keyframes enter { from { transform: translateY(12px); opacity: 0; } }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
@keyframes pop { 0% { transform: scale(.7); opacity: 0 } 70% { transform: scale(1.05) } 100% { transform: scale(1); opacity: 1 } }
.rise { animation: rise .55s cubic-bezier(.2,.9,.2,1) both; }

h1 { font: 400 38px/1 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance; } h1 em { font-style: italic; color: var(--accent); }
h2 { font: 400 26px/1.05 var(--display); margin: 0; }
.kicker { font-size: 13px; color: var(--muted); font-weight: 700; }
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.cta { all: unset; cursor: pointer; text-align: center; padding: 16px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 800 15px var(--body); transition: transform .15s, opacity .2s; box-sizing: border-box; box-shadow: 0 8px 20px #d98a9a40; }
.cta:active { transform: scale(.97); } .cta:focus-visible { outline: 3px solid var(--sage); outline-offset: 3px; } .cta[disabled] { opacity: .4; pointer-events: none; box-shadow: none; }
.ghost { all: unset; cursor: pointer; text-align: center; padding: 14px 18px; border-radius: 999px; background: var(--sage-3); color: #5f7a5c; font-weight: 800; font-size: 14px; }

.onb { flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 18px 24px 40px; overflow-y: auto; scrollbar-width: none;
  background: radial-gradient(90% 40% at 100% 0%, var(--blush-3), transparent 70%), radial-gradient(80% 40% at 0% 100%, var(--sage-3), transparent 70%); }
.chipset { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { all: unset; cursor: pointer; padding: 10px 15px; border-radius: 999px; background: var(--card); border: 1.5px solid var(--line); font-weight: 700; font-size: 14px; transition: background .2s, border-color .2s, transform .15s; }
.pick:active { transform: scale(.95); } .pick:focus-visible { outline: 2px solid var(--accent); }
.pick.on { background: var(--blush-2); border-color: var(--blush); color: #8c4b5a; }
.dots { display: flex; gap: 6px; } .dots i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); } .dots i.on { background: var(--sage); }

.top { padding: 8px 22px 10px; display: grid; gap: 10px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--card-2); border-radius: 999px; padding: 4px; }
.seg button { all: unset; cursor: pointer; text-align: center; padding: 8px; border-radius: 999px; font-weight: 800; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -22px; padding: 0 22px 2px; }
.filters button { all: unset; cursor: pointer; flex: none; padding: 7px 12px; border-radius: 999px; background: var(--card); border: 1.5px solid var(--line); font-size: 12.5px; font-weight: 800; color: var(--muted); }
.filters button.on { background: var(--sage-2); border-color: var(--sage); color: #4f6b4c; }
.body { position: relative; flex: 1; min-height: 0; }

.map { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; background: var(--land); border-top: 1px solid var(--line); }
.map:active { cursor: grabbing; }
.map svg { width: 100%; height: 100%; display: block; }
.map .water { fill: var(--water); } .map .canal { stroke: var(--water); fill: none; stroke-linecap: round; }
.map .park { fill: var(--park); } .map .road { stroke: var(--road); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.map .hood { fill: #b3a99d; font-family: var(--body); font-weight: 800; letter-spacing: .16em; text-transform: uppercase; text-anchor: middle; pointer-events: none; }
.pin { cursor: pointer; filter: drop-shadow(0 1px 1.5px #8a6f6040); }
.pin circle.bg { stroke: #fff; }
.pin text { text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pin.dim { opacity: .35; }
.pin.joined circle.ring { stroke: var(--accent); fill: none; }
.me circle.pulse { fill: var(--accent); opacity: .25; animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { transform: scale(.6); opacity: .45 } to { transform: scale(2.4); opacity: 0 } }
.mapctl { position: absolute; right: 14px; top: 14px; display: grid; gap: 6px; z-index: 3; }
.mapctl button { all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; background: #ffffffee; display: grid; place-items: center; font-weight: 800; font-size: 16px; box-shadow: var(--shadow); color: var(--text); }
.maplegend { position: absolute; left: 14px; top: 14px; z-index: 3; background: #ffffffee; padding: 6px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 800; color: var(--muted); box-shadow: var(--shadow); }

.list { position: absolute; inset: 0; overflow-y: auto; padding: 4px 22px 100px; display: grid; gap: 10px; align-content: start; scrollbar-width: none; }
.ev { all: unset; cursor: pointer; display: grid; grid-template-columns: 58px 1fr; gap: 14px; padding: 12px; border-radius: 24px; background: var(--card); box-shadow: var(--shadow); animation: rise .45s both; box-sizing: border-box; transition: transform .2s; }
.ev:hover { transform: translateY(-2px); } .ev:focus-visible { outline: 2px solid var(--accent); }
.tile { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; font-size: 28px; }
.ev h3 { margin: 0; font: 400 20px/1.05 var(--display); }
.ev .meta { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: 4px; }
.ev .why { font-size: 12px; color: #6f8c6b; font-weight: 800; margin-top: 5px; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--ink); border-radius: 32px 32px 0 0; padding: 10px 22px 34px; display: grid; gap: 12px; box-shadow: 0 -20px 60px #8a6f6033; animation: up .45s cubic-bezier(.2,.9,.2,1) both; max-height: 82%; overflow-y: auto; scrollbar-width: none; }
@keyframes up { from { transform: translateY(100%); } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet .hero { height: 110px; border-radius: 24px; display: grid; place-items: center; font-size: 54px; position: relative; }
.sheet .sample { position: absolute; top: 10px; left: 10px; font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: #ffffffcc; color: var(--muted); padding: 4px 8px; border-radius: 999px; }
.facts { display: grid; gap: 6px; font-size: 14px; font-weight: 700; } .facts span { color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--card-2); overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sage), var(--blush)); border-radius: 4px; transition: width .6s cubic-bezier(.2,.9,.2,1); }
.people { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-weight: 700; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: italic 15px var(--display); color: var(--text); border: 2px solid var(--ink); flex: none; }
.avs { display: flex; } .avs .av + .av { margin-left: -8px; }
.regular { background: var(--sage-3); border-radius: 20px; padding: 12px 14px; font-size: 13px; line-height: 1.5; font-weight: 700; color: #5f7a5c; } .regular b { color: #4f6b4c; }
.sheet .row { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.close { all: unset; cursor: pointer; position: absolute; top: 14px; right: 16px; width: 32px; height: 32px; border-radius: 50%; background: var(--card-2); display: grid; place-items: center; font-weight: 800; z-index: 3; color: var(--muted); }
.scrim { position: absolute; inset: 0; background: #3a363133; z-index: 15; animation: fade .3s both; } @keyframes fade { from { opacity: 0 } }

.tabs { position: absolute; left: 0; right: 0; bottom: 0; z-index: 12; display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px 18px 26px; background: linear-gradient(#fffdfa00, var(--ink) 35%); }
.tabs button { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 800; color: #c2b9ae; padding: 6px; border-radius: 12px; position: relative; }
.tabs button.on { color: var(--accent); } .tabs svg { width: 22px; height: 22px; }
.tabs .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--sage); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; animation: pop .4s both; }

.week { flex: 1; overflow-y: auto; padding: 8px 22px 110px; display: grid; gap: 14px; align-content: start; scrollbar-width: none; }
.day { display: grid; gap: 8px; } .day .d { font: italic 20px var(--display); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; display: grid; gap: 14px; font-weight: 700; line-height: 1.5; }
.streak { display: flex; gap: 14px; align-items: center; background: linear-gradient(120deg, var(--blush-3), var(--sage-3)); border-radius: 24px; padding: 16px; }
.streak b { font: italic 44px/1 var(--display); color: var(--accent); } .streak div { font-size: 13px; font-weight: 700; line-height: 1.45; }

.imsg { flex: 1; display: flex; flex-direction: column; background: #fff; min-height: 0; }
.imsg-head { display: grid; justify-items: center; gap: 4px; padding: 6px 0 10px; border-bottom: 1px solid #0000000f; background: #fbfbfb; }
.imsg-head .av { width: 44px; height: 44px; font-size: 24px; background: linear-gradient(150deg, var(--blush-2), var(--sage-2)); border: none; color: var(--accent); }
.imsg-head span { font-size: 12px; font-weight: 700; }
.thread { flex: 1; overflow-y: auto; padding: 12px 14px 170px; display: flex; flex-direction: column; gap: 6px; scrollbar-width: none; }
.b { max-width: 78%; padding: 9px 13px; border-radius: 19px; font-size: 14.5px; line-height: 1.38; white-space: pre-wrap; animation: rise .35s both; font-family: -apple-system, "SF Pro Text", var(--body); }
.b.them { background: #e9e9eb; color: #111; align-self: flex-start; border-bottom-left-radius: 6px; }
.b.me { background: #0a84ff; color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
.ts { align-self: center; font-size: 11px; color: #8e8e93; font-weight: 700; margin: 8px 0 2px; }
.compose { position: absolute; left: 0; right: 0; bottom: 74px; z-index: 13; display: flex; gap: 8px; padding: 8px 14px; background: #fff; margin: 0; }
.compose input { flex: 1; background: #fff; border: 1px solid #d1d1d6; border-radius: 18px; padding: 9px 14px; color: #111; font: 500 14px var(--body); outline: none; }
.compose input:focus { border-color: #0a84ff; }
.compose button { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; background: #0a84ff; color: #fff; display: grid; place-items: center; font-weight: 900; }
.quick { position: absolute; left: 0; right: 0; bottom: 126px; z-index: 13; display: flex; gap: 6px; padding: 0 14px; overflow-x: auto; scrollbar-width: none; }
.quick button { all: unset; cursor: pointer; flex: none; padding: 6px 12px; border-radius: 999px; background: var(--blush-3); color: #b06777; border: 1px solid var(--blush-2); font-size: 12.5px; font-weight: 800; }

.toast { position: absolute; left: 50%; top: 64px; translate: -50% 0; z-index: 50; background: #fff; color: var(--text); padding: 10px 18px; border-radius: 999px; font-weight: 800; font-size: 13px; animation: pop .35s both; white-space: nowrap; box-shadow: var(--shadow); }
canvas.confetti { position: absolute; inset: 0; z-index: 45; pointer-events: none; }
.c-cafe { background: #f6e6d3; } .c-sports { background: #f9dcdc; } .c-swim { background: #dcebf4; } .c-outdoors { background: #dfecd8; }
.c-music { background: #e9e0f4; } .c-food { background: #f8dfe4; } .c-art { background: #f6e1ec; } .c-wellness { background: #dcefe8; } .c-community { background: #f6edd2; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; } }

// ------------------------------------------------------------ 1. onboarding
function onboarding(step) {

  const dots = `<div class="dots">${[0,1,2].map((i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>`;

  if (step === 1) body = `<div class="rise"><div class="kicker">pick as many as you like</div><h1>where do you <em>hang out?</em></h1></div>

  const picks = visible(), body = $("#body");
  if (!picks.length) { body.innerHTML = `<div class="empty">Nothing in this category fits your settings this week.<button class="ghost" id="clr">show everything for you</button></div>`;
    $("#clr").onclick = () => { S.filter = "for-you"; discover(); }; return; }
  body.innerHTML = `<div class="list">${S.filter === "for-you" ? `<div class="label">picked for you</div>` : ""}${picks.map((p, i) => card(p, i)).join("")}</div>`;
  body.querySelector(".list").onclick = (e) => { const c = e.target.closest(".ev"); if (c) openSheet(c.dataset.id); };

function card(p, i) {

}

const LABELS = [["Ballard",47.672,-122.386],["Fremont",47.655,-122.352],["Capitol Hill",47.623,-122.317],["U District",47.664,-122.31],["Queen Anne",47.637,-122.359],["West Seattle",47.565,-122.385],["Downtown",47.606,-122.335],["Bellevue",47.613,-122.19],["Redmond",47.674,-122.13],["Green Lake",47.689,-122.33],["Magnolia",47.648,-122.398]];
const COLORS = { cafe:"#f3dcc2", sports:"#f7c9cc", swim:"#cfe3f0", outdoors:"#d3e6c9", music:"#e2d6f2", food:"#f6cfd8", art:"#f2d3e4", wellness:"#cfeadf", community:"#f3e3b8" };

function drawMap() {
  const picks = visible(), shown = new Set(picks.map((p) => p.event.id));
  const body = $("#body"), W = 390, H = Math.max(300, body.clientHeight || 520);
  if (!S.view0) { // fit all of the person's areas, with room around them
    const pts = (areasOf(S.profile).length ? areasOf(S.profile) : [{ lat: 47.63, lng: -122.33 }]).map((a) => P(a.lat, a.lng));
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    const w = Math.min(420, Math.max(140, (Math.max(...xs) - Math.min(...xs)) * 1.6, (Math.max(...ys) - Math.min(...ys)) * 1.6 * W / H));
    S.view0 = { x: cx - w / 2, y: cy - (w * H / W) / 2, w, h: w * H / W }; }
  const v = S.view0, k = v.w / 140;
  const pins = S.events.filter((e) => Date.parse(e.start) > NOW.getTime()).map((e) => {
    const [x, y] = P(e.lat, e.lng), on = shown.has(e.id), r = 8 * k;
    return `<g class="pin ${on ? "" : "dim"} ${S.joined.has(e.id) ? "joined" : ""}" data-id="${e.id}" transform="translate(${x},${y})">
      ${S.joined.has(e.id) ? `<circle class="ring" r="${r + 3 * k}" stroke-width="${1.8 * k}"/>` : ""}
      <circle class="bg" r="${r}" fill="${COLORS[e.category]}" stroke-width="${2 * k}"/>
      <text style="font-size:${9.5 * k}px">${e.emoji}</text></g>`; }).join("");
  const home = areasOf(S.profile).map((a) => { const [x, y] = P(a.lat, a.lng);
    return `<g class="me" transform="translate(${x},${y})"><circle class="pulse" r="${7 * k}"/><circle r="${4 * k}" fill="#d98a9a" stroke="#fff" stroke-width="${1.4 * k}"/></g>`; }).join("");
  const [gx, gy] = P(47.6805, -122.336);
  body.innerHTML = `<div class="map" id="map">
    <div class="maplegend">${picks.length} ${S.filter === "for-you" ? "picks for you" : S.filter} · sample events</div>
    <div class="mapctl"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="zc" aria-label="Recenter">◎</button></div>
    <svg id="svg" viewBox="${v.x} ${v.y} ${v.w} ${v.h}" preserveAspectRatio="xMidYMid slice">
      ${PARKS.map(([la, ln, a, b]) => { const [x, y] = P(la, ln); return `<ellipse class="park" cx="${x}" cy="${y}" rx="${b * KX}" ry="${a * KY}"/>`; }).join("")}
      ${WATER.map((w) => `<polygon class="water" points="${poly(w)}"/>`).join("")}
      ${CANALS.map((c) => `<polyline class="canal" stroke-width="2.4" points="${poly(c)}"/>`).join("")}
      <ellipse class="park" cx="${gx}" cy="${gy}" rx="${.0075 * KX}" ry="${.008 * KY}"/><ellipse class="water" cx="${gx}" cy="${gy}" rx="${.0055 * KX}" ry="${.006 * KY}"/>
      ${ROADS.map((r) => `<polyline class="road" stroke-width="${1.4 * k}" points="${poly(r)}"/>`).join("")}
      ${LABELS.map(([l, la, ln]) => { const [x, y] = P(la, ln); return `<text class="hood" x="${x}" y="${y}" style="font-size:${5 * k}px">${l}</text>`; }).join("")}
      ${home}${pins}
    </svg></div>`;
  const svg = $("#svg"), map = $("#map");
  const setV = () => svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
  const zoom = (f, cx = v.x + v.w / 2, cy = v.y + v.h / 2) => { const nw = Math.min(420, Math.max(40, v.w * f)), nh = nw * v.h / v.w;
    v.x = cx - (cx - v.x) * nw / v.w; v.y = cy - (cy - v.y) * nh / v.h; v.w = nw; v.h = nh; drawMap(); };
  $("#zi").onclick = () => zoom(.7); $("#zo").onclick = () => zoom(1.45); $("#zc").onclick = () => { S.view0 = null; drawMap(); };
  map.addEventListener("wheel", (e) => { e.preventDefault(); const r = svg.getBoundingClientRect();
    zoom(e.deltaY > 0 ? 1.15 : .87, v.x + (e.clientX - r.left) / (r.width || 1) * v.w, v.y + (e.clientY - r.top) / (r.height || 1) * v.h); }, { passive: false });
  let drag = null;
  map.addEventListener("pointerdown", (e) => { if (e.target.closest(".mapctl")) return;
    drag = { x: e.clientX, y: e.clientY, vx: v.x, vy: v.y, moved: false, id: e.target.closest(".pin")?.dataset.id };
    try { map.setPointerCapture(e.pointerId); } catch {} });
  map.addEventListener("pointermove", (e) => { if (!drag) return; const r = svg.getBoundingClientRect();
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    v.x = drag.vx - dx * v.w / (r.width || 1); v.y = drag.vy - dy * v.h / (r.height || 1); setV(); });
  map.addEventListener("pointerup", () => { const d = drag; drag = null; if (d && !d.moved && d.id) openSheet(d.id); });
}

// ------------------------------------------------------------ 4. event sheet + join
function closeSheet(silent) {
  document.querySelectorAll(".sheet,.scrim").forEach((x) => x.remove());
  if (!silent && S.tab === "discover") { S.view === "map" ? drawMap() : drawList(); rail(S.view === "map" ? 1 : 2); }
  if (!silent && S.tab === "week") week();
}
function openSheet(id) {
  rail(3);
  const e = ev(id), d = distTo(e);
  const p = rankEvents(S.events, { ...S.profile, maxDistanceKm: 99, maxBudget: undefined, when: [] }, NOW, { limit: 99 }).find((x) => x.event.id === id);
  const n = +id.slice(1);
  const avs = Array.from({ length: Math.min(5, e.going) }, (_, i) => `<div class="av" style="background:${AVC[(i + n) % AVC.length]}">${"ABCDEFGHJKLMNPRSTW"[(i * 7 + n) % 18]}</div>`).join("");
  closeSheet(true);
  $("#phone").insertAdjacentHTML("beforeend", `<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-label="${e.title}">
    <div class="grab"></div><button class="close" id="x" aria-label="Close">✕</button>
    <div class="hero c-${e.category}"><span class="sample">sample event</span>${e.emoji}</div>
    <div><div class="kicker">${e.host}</div><h2>${e.title}</h2></div>
    <div class="facts">
      <div>🗓 ${fmt(e.start, { weekday: "long", month: "short", day: "numeric" })} · ${time(e.start)} – ${time(e.end)}</div>
      <div>📍 ${e.place}, ${e.neighborhood}${d != null ? ` <span>· ${d.toFixed(1)} km from ${nearLabel(e)}</span>` : ""}</div>
      <div>💸 ${price(e.cost)}${e.beginnerFriendly ? " <span>· beginner-friendly</span>" : ""}</div></div>
    <div style="font-size:14px;line-height:1.55;color:#5e5750">${e.blurb}</div>
    <div class="people"><div class="avs">${avs}</div><span id="cnt">${e.going} going · ${e.capacity - e.going} spots left</span></div>
    <div class="bar"><i id="fill" style="width:${(e.going / e.capacity) * 100}%"></i></div>
    ${e.recurring ? `<div class="regular">🔁 Happens <b>${e.recurring}</b>. Come three times and you're a regular. Huddle can save your spot each week.</div>` : ""}
    ${p?.reasons?.length ? `<div class="kicker">why it's for you: ${p.reasons.join(" · ")}</div>` : ""}
    <div class="row"><button class="ghost" id="share">↗ invite</button><button class="cta" id="join"></button></div>
  </div>`);
  const label = () => { $("#join").textContent = S.joined.has(id) ? "✓ you're going · tap to leave" : "I'm going"; };
  label();
  $("#scrim").onclick = () => closeSheet(); $("#x").onclick = () => closeSheet();
  $("#share").onclick = () => toast("invite link copied (demo)");
  $("#join").onclick = () => {
    if (S.joined.has(id)) { S.joined.delete(id); e.going--; toast("you're off the list"); }
    else { if (e.going >= e.capacity) return toast("this one's full"); S.joined.add(id); e.going++; confetti(); toast(`you're in! ${e.going - 1} others going`); }
    label();
    $("#cnt").textContent = `${e.going} going · ${e.capacity - e.going} spots left`;
    $("#fill").style.width = `${(e.going / e.capacity) * 100}%`;
    refreshTabs();
  };
}

// ------------------------------------------------------------ 5. my week
function week() {
  rail(4);
  const mine = [...S.joined].map(ev).sort((a, b) => Date.parse(a.start) - Date.parse(b.start));
  const days = {};
  for (const e of mine) (days[fmt(e.start, { weekday: "long", month: "short", day: "numeric" })] ??= []).push(e);
  const regulars = mine.filter((e) => e.recurring).length;
  screen(`<div class="top"><div><div class="kicker">${mine.length ? `${mine.length} plan${mine.length > 1 ? "s" : ""} this week` : "nothing yet"}</div><h1>your <em>week</em></h1></div></div>
    <div class="week">${mine.length ? `
      <div class="streak"><b>${mine.length}</b><div>${mine.length === 1 ? "event" : "events"} this week${regulars ? `, ${regulars} of them weekly. Keep showing up and they become your regular spots.` : ". Weekly events are the easiest way to become a regular."}</div></div>
      ${Object.entries(days).map(([d, es]) => `<div class="day"><div class="d">${d}</div>${es.map((e, i) => card({ event: e, distanceKm: distTo(e), reasons: [] }, i)).join("")}</div>`).join("")}`
      : `<div class="empty">You haven't joined anything yet.<br>Pick something small. Showing up is the whole thing.<button class="cta" id="find">find something →</button></div>`}
    </div>${tabs()}`);
  bindTabs();
  $("#find")?.addEventListener("click", () => go("discover", "list"));
  $(".week").addEventListener("click", (e) => { const c = e.target.closest(".ev"); if (c) openSheet(c.dataset.id); });
}

// ------------------------------------------------------------ 6. the weekly iMessage
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function digestText(picks) {
  return `🗓 your week near ${whereLabel()} (sample events)\n\n` +
    picks.map((p, i) => `${i + 1}. ${p.event.emoji} ${p.event.title}\n   ${dayShort(p.event.start)} ${time(p.event.start)} · ${p.event.neighborhood} · ${price(p.event.cost)} · ${p.event.going} going`).join("\n\n") +
    "\n\nreply a number to join (like 1), INFO 2 for details, or MORE.";
}
function texts() {
  rail(5);
  if (!S.texts) { const picks = forYou(); S.texts = { list: picks.map((p) => p.event.id), msgs: [["ts", "Sunday 9:00 AM"], ["them", "good morning ☀️ here's your week:"], ["them", digestText(picks)]] }; }
  screen(`<div class="imsg"><div class="imsg-head"><div class="av">h</div><span>Huddle</span></div>
    <div class="thread" id="th">${S.texts.msgs.map(([w, t]) => w === "ts" ? `<div class="ts">${t}</div>` : `<div class="b ${w}">${esc(t)}</div>`).join("")}</div></div>
    <div class="quick" id="quick">${["1","INFO 2","MORE","something outdoorsy","MY"].map((q) => `<button type="button">${q}</button>`).join("")}</div>
    <form class="compose" id="cf"><input id="ci" placeholder="iMessage" autocomplete="off" aria-label="Message Huddle"><button aria-label="Send">↑</button></form>${tabs()}`);
  bindTabs();
  const th = $("#th"); th.scrollTop = th.scrollHeight;
  const add = (w, t) => { S.texts.msgs.push([w, t]); th.insertAdjacentHTML("beforeend", `<div class="b ${w}">${esc(t)}</div>`); th.scrollTop = th.scrollHeight; };
  const send = (t) => { if (!t.trim()) return; add("me", t); setTimeout(() => { if ($("#th") === th) add("them", reply(t.trim())); }, 600); };
  $("#cf").onsubmit = (e) => { e.preventDefault(); send($("#ci").value); $("#ci").value = ""; };
  $("#quick").onclick = (e) => { const b = e.target.closest("button"); if (b) send(b.textContent); };
}
const MOODS = { cafe: /caf|coffee|matcha|pop/i, sports: /sport|ball|run|climb/i, swim: /swim|pool/i, outdoors: /outdoor|hike|nature|kayak|bike/i,
  music: /music|jam|mic/i, food: /food|eat|dumpling|ramen/i, art: /art|sketch|draw/i, wellness: /yoga|sauna|wellness/i, community: /community|volunteer|game/i };
function reply(t) {
  const up = t.toUpperCase(), L = S.texts.list;
  const n = up.match(/^(?:JOIN\s*)?(\d)$/);
  if (n) { const e = ev(L[+n[1] - 1]); if (!e) return "that number isn't on your list. text EVENTS to see it again.";
    if (S.joined.has(e.id)) return `you're already in for ${e.title}!`;
    S.joined.add(e.id); e.going++; refreshTabs();
    return `you're in! ${e.emoji} ${e.title}\n${fmt(e.start, { weekday: "long" })}, ${time(e.start)} · ${e.place}\n${e.going - 1} others going. I'll text you a reminder before it starts.${e.recurring ? `\n\nit happens ${e.recurring}, so come a few times and you'll be a regular.` : ""}`; }
  const info = up.match(/^INFO\s*(\d)$/);
  if (info) { const e = ev(L[+info[1] - 1]); return e ? `${e.emoji} ${e.title}\n${fmt(e.start, { weekday: "long", month: "short", day: "numeric" })}, ${time(e.start)} – ${time(e.end)}\n📍 ${e.place}\n${price(e.cost)} · ${e.going}/${e.capacity} going\n\n${e.blurb}\n\nreply ${info[1]} to join.` : "that number isn't on your list."; }
  if (up === "MORE") { const p = rankEvents(S.events, S.profile, NOW, { limit: 5, excludeIds: new Set([...L, ...S.joined]) }); if (!p.length) return "that's everything for this week!"; S.texts.list = p.map((x) => x.event.id); return digestText(p); }
  if (up === "MY") { const m = [...S.joined].map(ev); return m.length ? "your plans:\n\n" + m.map((e) => `${e.emoji} ${e.title}, ${dayShort(e.start)} ${time(e.start)}`).join("\n") : "nothing yet. text EVENTS to find something."; }
  if (up === "EVENTS") { const p = forYou(); S.texts.list = p.map((x) => x.event.id); return digestText(p); }
  const mood = Object.keys(MOODS).filter((c) => MOODS[c].test(t));
  if (mood.length) { const p = rankEvents(S.events, { ...S.profile, interests: mood }, NOW, { limit: 5 }); if (!p.length) return "nothing like that fits your settings this week."; S.texts.list = p.map((x) => x.event.id); return digestText(p); }
  return "EVENTS · MORE · 1, 2, 3 to join · INFO 2 · MY · or text a mood like \"something outdoorsy\"";
}

function confetti() {
  const cv = document.createElement("canvas"); cv.className = "confetti"; cv.width = 780; cv.height = 1688; $("#phone").append(cv);
  const ctx = cv.getContext("2d"); ctx.scale(2, 2);
  const colors = ["#f2b8c6", "#cfe3c8", "#ffffff", "#f6e6d3", "#bcd6b6", "#e9a7b4"];
  const ps = Array.from({ length: 110 }, () => ({ x: 195, y: 640, vx: (Math.random() - .5) * 12, vy: -Math.random() * 15 - 5, r: Math.random() * 6 + 4, a: Math.random() * 6, va: (Math.random() - .5) * .4, c: colors[Math.floor(Math.random() * 5)] }));
  const t0 = performance.now();
  (function f(now) { ctx.clearRect(0, 0, 390, 844);
    for (const p of ps) { p.vy += .38; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if (now - t0 < 2600) requestAnimationFrame(f); else cv.remove(); })(t0);
}

onboarding(0);
